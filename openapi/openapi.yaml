openapi: 3.0.3

info:
  title: Marketplace API
  version: 0.1.0
  description: |
    REST API of a simple marketplace: a catalog of products and customer orders.

servers:
  - url: http://localhost:3000/v1
    description: Local development (API version 1, URI versioning)

security: []

tags:
  - name: Products
    description: Product catalog
  - name: Orders
    description: Customer orders

paths:
  /products:
    get:
      tags: [Products]
      operationId: listProducts
      summary: List products
      description: Returns a page of products. Use `next_cursor` from the response as `cursor` to get the next page.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of products.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductPage"
        "400":
          $ref: "#/components/responses/BadRequest"

    post:
      tags: [Products]
      operationId: createProduct
      summary: Create a product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductCreate"
      responses:
        "201":
          description: Product created.
          headers:
            Location:
              description: URL of the created product.
              schema:
                type: string
                format: uri-reference
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "400":
          $ref: "#/components/responses/BadRequest"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /products/{product_id}:
    parameters:
      - $ref: "#/components/parameters/ProductId"
    get:
      tags: [Products]
      operationId: getProduct
      summary: Get a product by id
      responses:
        "200":
          description: The product.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "404":
          $ref: "#/components/responses/NotFound"

  /orders:
    get:
      tags: [Orders]
      operationId: listOrders
      summary: List orders
      description: Returns a page of orders. Use `next_cursor` from the response as `cursor` to get the next page.
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: A page of orders.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderPage"
        "400":
          $ref: "#/components/responses/BadRequest"

    post:
      tags: [Orders]
      operationId: createOrder
      summary: Create an order
      description: |
        Creates an order from a list of products and quantities.

        The operation is idempotent when the `Idempotency-Key` header is used:
        repeating a request with the same key and the same body returns the same
        response as the first request (same status and body) and does not create
        a second order. Reusing a key with a different body is rejected with 422.
        If the first request with this key is still being processed, the repeat
        is rejected with 409 and can be retried later.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: |
            Unique key chosen by the client (a UUID is recommended) that identifies
            one logical operation. Retrying a request with the same key and the same
            body returns the original response instead of repeating the operation.
            Use a new key for every new operation.
          schema:
            type: string
            minLength: 1
            maxLength: 255
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderCreate"
      responses:
        "201":
          description: Order created.
          headers:
            Location:
              description: URL of the created order.
              schema:
                type: string
                format: uri-reference
            Idempotency-Replay:
              description: Present with value `true` when this is a replay of an earlier request with the same Idempotency-Key.
              schema:
                type: string
                enum: ["true"]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /orders/{order_id}:
    parameters:
      - $ref: "#/components/parameters/OrderId"
    get:
      tags: [Orders]
      operationId: getOrder
      summary: Get an order by id
      responses:
        "200":
          description: The order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "404":
          $ref: "#/components/responses/NotFound"

components:
  parameters:
    ProductId:
      name: product_id
      in: path
      required: true
      description: Product identifier.
      schema:
        type: string
        format: uuid
    OrderId:
      name: order_id
      in: path
      required: true
      description: Order identifier.
      schema:
        type: string
        format: uuid
    Limit:
      name: limit
      in: query
      description: Maximum number of items to return in one page.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Cursor:
      name: cursor
      in: query
      description: |
        Opaque pagination token. Pass the `next_cursor` value from the previous
        response to get the next page; omit it to get the first page.
        Clients must not parse, build or modify it: its format is an
        implementation detail and may change without notice.
      schema:
        type: string

  schemas:
    Product:
      type: object
      required: [id, title, price_cents, currency, created_at]
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 2000
        price_cents:
          type: integer
          minimum: 0
          description: Price in minor currency units (cents) to avoid floating point errors.
        currency:
          type: string
          pattern: "^[A-Z]{3}$"
          example: USD
        created_at:
          type: string
          format: date-time
          readOnly: true

    ProductCreate:
      type: object
      required: [title, price_cents, currency]
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 2000
        price_cents:
          type: integer
          minimum: 0
        currency:
          type: string
          pattern: "^[A-Z]{3}$"
          example: USD

    OrderItem:
      type: object
      required: [product_id, quantity]
      properties:
        product_id:
          type: string
          format: uuid
        quantity:
          type: integer
          minimum: 1
          maximum: 100

    OrderCreate:
      type: object
      required: [items]
      additionalProperties: false
      properties:
        items:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/OrderItem"

    Order:
      type: object
      required: [id, status, items, total_cents, currency, created_at]
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        status:
          type: string
          enum: [pending, paid, shipped, cancelled]
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItem"
        total_cents:
          type: integer
          minimum: 0
        currency:
          type: string
          pattern: "^[A-Z]{3}$"
          example: USD
        created_at:
          type: string
          format: date-time
          readOnly: true

    ProductPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Product"
        next_cursor:
          type: string
          nullable: true
          description: Cursor for the next page, or null when there are no more pages.

    OrderPage:
      type: object
      required: [items, next_cursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Order"
        next_cursor:
          type: string
          nullable: true
          description: Cursor for the next page, or null when there are no more pages.

    Problem:
      type: object
      description: Error details according to RFC 9457.
      required: [type, title, status, detail, instance]
      properties:
        type:
          type: string
          format: uri-reference
          example: https://api.marketplace.example/problems/validation-error
        title:
          type: string
          example: Validation failed
        status:
          type: integer
          example: 422
        detail:
          type: string
        instance:
          type: string
          format: uri-reference

  responses:
    BadRequest:
      description: The request is malformed (invalid JSON, bad query parameter).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: The requested resource does not exist.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Conflict:
      description: A request with the same Idempotency-Key is still being processed.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    UnprocessableEntity:
      description: The request is well-formed but violates business or validation rules (for example, an Idempotency-Key reused with a different body).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
